<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="metric-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="metric-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="metric-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#04060B" />
    </linearGradient>
  </defs>

  <style>
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 26px; font-weight: 900; }
    .metric-label { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #94A3B8; letter-spacing: 0.8px; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #64748B; }
  </style>

  <!-- Container -->
  <rect width="900" height="100" rx="10" fill="url(#metric-bg)" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 1: CGPA -->
  <g transform="translate(0, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-cyan)">9.47</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">CGPA</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">VIT Vellore</text>
    <line x1="150" y1="20" x2="150" y2="80" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Metric 2: Patents -->
  <g transform="translate(150, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-violet)">2</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">PUBLISHED PATENTS</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">Intellectual Property India</text>
    <line x1="150" y1="20" x2="150" y2="80" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Metric 3: Hackathon Wins -->
  <g transform="translate(300, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-cyan)">4×</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">HACKATHON WINS</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">Competitive Build Sprints</text>
    <line x1="150" y1="20" x2="150" y2="80" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Metric 4: Rare Attack Recall -->
  <g transform="translate(450, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-violet)">15×</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">RARE ATTACK RECALL</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">NSL-KDD IDS Benchmark</text>
    <line x1="150" y1="20" x2="150" y2="80" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Metric 5: Commits -->
  <g transform="translate(600, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-cyan)">340+</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">VERIFIED COMMITS</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">Active Contribution History</text>
    <line x1="150" y1="20" x2="150" y2="80" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Metric 6: Repositories -->
  <g transform="translate(750, 0)">
    <text x="75" y="44" text-anchor="middle" class="metric-value" fill="url(#metric-violet)">40+</text>
    <text x="75" y="66" text-anchor="middle" class="metric-label">REPOSITORIES</text>
    <text x="75" y="82" text-anchor="middle" class="metric-sub">Personal &amp; Team Systems</text>
  </g>
</svg>
