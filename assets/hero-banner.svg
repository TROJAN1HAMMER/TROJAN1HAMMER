<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hero-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="hero-grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="hero-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="hero-glow-1" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-glow-2" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 900; letter-spacing: 2px; fill: #FFFFFF; }
    .hero-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #38BDF8; }
    .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #CBD5E1; }
    .hero-mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #94A3B8; font-weight: 500; }
    .hero-badge { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Background Panel -->
  <rect width="900" height="200" rx="14" fill="#05070E" stroke="#1E293B" stroke-width="1.2" />
  <rect width="900" height="200" rx="14" fill="url(#hero-glow-1)" />
  <rect width="900" height="200" rx="14" fill="url(#hero-glow-2)" />

  <!-- Top Accent Gradient Line -->
  <path d="M 0 14 Q 0 0 14 0 L 886 0 Q 900 0 900 14" fill="none" stroke="url(#hero-border-grad)" stroke-width="3" />

  <!-- Corner Tech Accent Marks -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
    <path d="M 16 28 L 16 16 L 28 16" fill="none" />
    <path d="M 884 28 L 884 16 L 872 16" fill="none" />
    <path d="M 16 172 L 16 184 L 28 184" fill="none" />
    <path d="M 884 172 L 884 184 L 872 184" fill="none" />
  </g>

  <!-- Left Accent Status Indicator -->
  <g transform="translate(36, 32)">
    <rect width="105" height="22" rx="11" fill="#0C1E33" stroke="#0284C7" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#34D399" />
    <text x="22" y="14.5" class="hero-badge" fill="#38BDF8">SYSTEM ONLINE</text>
  </g>

  <!-- Right Academic Standing Badge -->
  <g transform="translate(680, 32)">
    <rect width="184" height="22" rx="11" fill="#171126" stroke="#7C3AED" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#A78BFA" />
    <text x="22" y="14.5" class="hero-badge" fill="#C084FC">VIT VELLORE // CGPA 9.47</text>
  </g>

  <!-- Central Hero Content -->
  <g transform="translate(0, 84)">
    <!-- Name -->
    <text x="450" y="0" text-anchor="middle" class="hero-name">HARSHITH B</text>

    <!-- Role & Domains -->
    <text x="450" y="26" text-anchor="middle" class="hero-role">
      SOFTWARE ENGINEER <tspan fill="#64748B">•</tspan> BACKEND SYSTEMS <tspan fill="#64748B">•</tspan> <tspan fill="#C084FC">APPLIED AI/ML</tspan> <tspan fill="#64748B">•</tspan> <tspan fill="#38BDF8">APPLICATION SECURITY</tspan>
    </text>

    <!-- Positioning statement -->
    <text x="450" y="48" text-anchor="middle" class="hero-sub">
      Integrated M.Tech Software Engineering @ VIT Vellore • Head of Cloud &amp; Networking @ Baldmann
    </text>

    <!-- Telemetry Bar -->
    <text x="450" y="68" text-anchor="middle" class="hero-mono">
      <tspan fill="#38BDF8">⚡ Distributed Microservices</tspan>  <tspan fill="#475569">|</tspan>  <tspan fill="#A78BFA">🤖 Transformers &amp; RAG</tspan>  <tspan fill="#475569">|</tspan>  <tspan fill="#34D399">🔐 DevSecOps &amp; Telemetry</tspan>  <tspan fill="#475569">|</tspan>  <tspan fill="#38BDF8">☁️ AWS Cloud</tspan>
    </text>
  </g>
</svg>
